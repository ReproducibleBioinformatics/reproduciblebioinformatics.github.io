<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Publications - Reproducible Bioinformatics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="nav-container">
            <div class="brand"><a href="index.html">Reproducible Bioinformatics</a></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="team.html">Team</a></li>
                    <li><a href="publications.html">Publications</a></li>
                    <li><a href="collaborations.html">Collaborations</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contacts.html">Contacts</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Publications</h2>
        <p>
            Publications from our team members, automatically fetched from NCBI PubMed based on affiliation periods.
        </p>
        <div id="publications-list">
            <div class="loading">Loading publications from PubMed...</div>
        </div>
    </main>

    <script src="common.js"></script>
    <script>
        let allPublications = [];
        let displayedCount = 0;
        const BATCH_SIZE = 20;

        async function fetchPublicationsFromNCBI() {
            const container = document.getElementById('publications-list');
            container.innerHTML = `
                <div class="loading">
                    <div style="display:inline-block;width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite;"></div>
                    <p style="margin-top:1rem;">Fetching publications from NCBI PubMed...</p>
                    <p id="progress-text" style="font-size:0.85rem;color:var(--text-muted);margin-top:0.5rem;"></p>
                </div>
                <style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
            `;

            try {
                // ── Load team dynamically via GitHub API (same as common.js) ──
                const members = await loadTeamData();

                const pubmedIds = new Set();
                let processedMembers = 0;

                for (const member of members) {
                    const lastName     = member.lastName;
                    const firstInitial = member.firstName.charAt(0);
                    const startYear    = member.startDate ? member.startDate.split('-')[0] : '2015';
                    const endYear      = member.endDate === 'current'
                        ? new Date().getFullYear()
                        : (member.endDate ? member.endDate.split('-')[0] : new Date().getFullYear());

                    processedMembers++;
                    const progressEl = document.getElementById('progress-text');
                    if (progressEl) {
                        progressEl.textContent = `Processing ${member.firstName} ${member.lastName} (${processedMembers}/${members.length})...`;
                    }

                    const affiliation  = Array.isArray(member.affiliation)
                        ? member.affiliation[0]
                        : (member.affiliation || 'University of Turin');
                    const searchQuery  = `${lastName} ${firstInitial}[Author] AND ${affiliation}[Affiliation] AND (${startYear}:${endYear}[PDAT])`;
                    const searchUrl    = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(searchQuery)}&retmode=json&retmax=100`;

                    try {
                        const searchResp = await fetch(searchUrl);
                        const searchData = await searchResp.json();

                        if (searchData.esearchresult?.idlist?.length > 0) {
                            const ids       = searchData.esearchresult.idlist;
                            const summaryUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=${ids.join(',')}&retmode=json`;
                            const summaryResp = await fetch(summaryUrl);
                            const summaryData = await summaryResp.json();

                            if (summaryData.result) {
                                ids.forEach(id => {
                                    if (!pubmedIds.has(id) && summaryData.result[id]) {
                                        pubmedIds.add(id);
                                        const pub = summaryData.result[id];
                                        allPublications.push({
                                            pmid:    id,
                                            title:   pub.title   || 'No title',
                                            authors: pub.authors ? pub.authors.map(a => a.name).join(', ') : 'Unknown',
                                            journal: pub.source  || 'Unknown',
                                            year:    pub.pubdate ? pub.pubdate.split(' ')[0] : 'Unknown'
                                        });
                                    }
                                });
                            }
                        }

                        await new Promise(resolve => setTimeout(resolve, 350));

                    } catch (err) {
                        console.error(`Error fetching publications for ${member.firstName} ${member.lastName}:`, err);
                    }
                }

                allPublications.sort((a, b) => b.year.localeCompare(a.year));
                displayedCount = 0;
                displayPublications();

            } catch (error) {
                console.error('Error loading publications:', error);
                container.innerHTML = '<p class="small-muted">Error loading publications. Please try again later.</p>';
            }
        }

        function displayPublications() {
            const container = document.getElementById('publications-list');

            if (allPublications.length === 0) {
                container.innerHTML = '<p class="small-muted">No publications found.</p>';
                return;
            }

            const endIndex = Math.min(displayedCount + BATCH_SIZE, allPublications.length);
            let html = '';

            if (displayedCount === 0) {
                html = `<p class="small-muted" style="margin-bottom:1.5rem;">Found ${allPublications.length} publications. Showing first ${Math.min(BATCH_SIZE, allPublications.length)}.</p>`;
                container.innerHTML = '';
            }

            for (let i = displayedCount; i < endIndex; i++) {
                const pub = allPublications[i];
                html += `
                    <div class="publication-item">
                        <div class="title">${pub.title}</div>
                        <div class="authors">${pub.authors}</div>
                        <div class="journal">${pub.journal}, ${pub.year}</div>
                        <a href="https://pubmed.ncbi.nlm.nih.gov/${pub.pmid}/" target="_blank">View on PubMed</a>
                    </div>
                `;
            }

            displayedCount = endIndex;
            container.innerHTML += html;

            const oldButton = container.querySelector('.load-more-container');
            if (oldButton) oldButton.remove();

            if (displayedCount < allPublications.length) {
                const buttonContainer = document.createElement('div');
                buttonContainer.className = 'load-more-container';
                buttonContainer.style.cssText = 'text-align:center;margin-top:2rem;';
                buttonContainer.innerHTML = `
                    <button onclick="loadMore()" style="background-color:var(--accent);color:white;border:none;padding:0.75rem 2rem;border-radius:4px;cursor:pointer;font-size:1rem;transition:background-color 0.2s;" onmouseover="this.style.backgroundColor='var(--accent-dark)'" onmouseout="this.style.backgroundColor='var(--accent)'">
                        Load More (${allPublications.length - displayedCount} remaining)
                    </button>
                `;
                container.appendChild(buttonContainer);
            } else {
                const endMessage = document.createElement('p');
                endMessage.className = 'small-muted';
                endMessage.style.cssText = 'text-align:center;margin-top:2rem;';
                endMessage.textContent = 'All publications loaded.';
                container.appendChild(endMessage);
            }
        }

        function loadMore() { displayPublications(); }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPublicationsFromNCBI();
        });
    </script>

</body>
</html>
